name: GCP deployment configuration
on:
  pull_request:
    paths:
      - "deploy/gcp/**"
      - ".gcloudignore"
      - ".github/workflows/gcp-deployment.yml"
      - ".github/workflows/gcp-release*.yml"
      - ".github/workflows/owner-auth-coverage.yml"
permissions:
  contents: read
jobs:
  deployment-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: docker compose version
      - run: python3 -m unittest discover -s deploy/gcp -p 'test_*.py' -v
      - run: bash -n deploy/gcp/bootstrap.sh && sh -n deploy/gcp/block-metadata.sh
